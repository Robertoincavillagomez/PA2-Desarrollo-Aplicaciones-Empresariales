spring.application.name=sistema-pedidos-springboot

# ==============================
# SERVIDOR
# ==============================
server.port=8081
# Opcional: conservar una URL parecida a la aplicacion Jakarta
server.servlet.context-path=/sistema-pedidos

# ==============================
# SPRING MVC / JSP
# ==============================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===================================================================
# CONFIGURACION DE DATA SOURCE (H2 en memoria)
# ===================================================================
# Define la URL de conexion. 'testdb' es el nombre de tu base de datos.
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# Driver oficial para la conexion con H2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

# ===================================================================
# CONFIGURACION DE LA CONSOLA WEB DE H2
# ===================================================================
# Habilita la interfaz web para gestionar la BD desde el navegador
spring.h2.console.enabled=true
# Define la ruta de acceso a la consola (ej. http://localhost:8081/h2-console)
spring.h2.console.path=/h2-console

# ===================================================================
# CONFIGURACION DE JPA / HIBERNATE
# ===================================================================
# Indica a Hibernate el dialecto SQL especifico de H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Muestra las consultas SQL ejecutadas en la consola de la aplicacion
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Formatea el codigo SQL de la consola para que sea legible
spring.jpa.hibernate.ddl-auto=create-drop
# Los datos deben quedar cargados antes de salir de la capa de acceso/negocio
spring.jpa.open-in-view=false

# ==============================
# INVENTARIO SERVICE
# ==============================
inventario.api.base-url=http://localhost:8082/inventario-service/api/inventario
inventario.api.connect-timeout-ms=2000
inventario.api.read-timeout-ms=3000
